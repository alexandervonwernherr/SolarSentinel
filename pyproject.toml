[project]
name = "solarsentinel"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "lightgbm>=4.7.0",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.6.6",
    "matplotlib>=3.11.2",
    "missingno>=0.5.2",
    "nbdime>=4.0.4",
    "seaborn>=0.13.2",
]
